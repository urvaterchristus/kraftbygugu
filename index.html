<nav class="main-tabs" aria-label="Hauptbereiche"><button type="button" data-page="training" class="active">Training</button><button type="button" data-page="customize">Anpassen</button><button type="button" data-page="statistics">Statistiken</button></nav><div class="main-actions"><button class="primary" id="newWorkout">＋ Training eintragen</button></div><nav id="customizeTabs" class="customize-tabs" aria-label="Anpassen" hidden><button data-tab="routines" class="active">Routinen</button><button data-tab="exercises">Übungen</button><button data-tab="variations">Variationen</button></nav><section id="analyticsPanel" aria-label="Statistiken" hidden></section><section class="section-head" id="listHeading"><div><p class="eyebrow" id="sectionLabel"></p><h2 id="sectionTitle"></h2></div><button id="addItem">＋ Hinzufügen</button></section><div id="variationFilters" class="variation-filters" aria-label="Variationen filtern" hidden></div><div id="typeFilters" hidden></div><section id="content" class="cards"></section>
